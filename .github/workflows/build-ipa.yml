name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Locate Project and List Schemes
        run: |
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found project: $PROJECT_FILE"
          xcodebuild -list -project "$PROJECT_FILE"

      - name: Build unsigned app
        run: |
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          
          xcodebuild clean build \
            -project "$PROJECT_FILE" \
            -scheme 3dsGamepadConnector \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r 3dsGamepadConnector.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dsGamepadConnector-unsigned-ipa
          path: 3dsGamepadConnector.ipa
