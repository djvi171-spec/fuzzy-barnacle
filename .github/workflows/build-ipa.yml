name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Clone 3dsGamepadConnector source
        run: git clone https://github.com/Maxcimkj/3dsGamepadConnector.git repo

      - name: Safe Patch & Build Setup
        run: |
          cd repo
          # Inject Local Network permission into Info.plist
          PLIST=$(find . -name "Info.plist" | head -n 1)
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Connects to 3DS InputRedirection over Wi-Fi'" "$PLIST" || true

          # Safely patch right thumbstick optional unwraps with valid Swift syntax
          python3 -c '
          import glob
          for path in glob.glob("**/*.swift", recursive=True):
              with open(path, "r") as f:
                  code = f.read()
              
              # Replace unsafe property accesses with safe optional defaults
              code = code.replace("rightThumbstick.xAxis.value", "(rightThumbstick?.xAxis?.value ?? 0.0)")
              code = code.replace("rightThumbstick.yAxis.value", "(rightThumbstick?.yAxis.value ?? 0.0)")
              code = code.replace("rightThumbstick.xAxis", "(rightThumbstick?.xAxis")
              code = code.replace("rightThumbstick.yAxis", "(rightThumbstick?.yAxis")

              with open(path, "w") as f:
                  f.write(code)
          '

      - name: Build unsigned app
        run: |
          cd repo
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_PATH" | awk '/Schemes:/{getline; print $1}')
          echo "Building project: $PROJ_PATH with scheme: $SCHEME_NAME"

          xcodebuild clean build \
            -project "$PROJ_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          APP_PATH=$(find repo/build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r 3dsGamepadConnector.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dsGamepadConnector-unsigned-ipa
          path: 3dsGamepadConnector.ipa
