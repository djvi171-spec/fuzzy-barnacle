name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned app
        run: |
          xcodebuild clean build \
            -project 3dsGamepadConnector/3dsGamepadConnector.xcodeproj \
            -scheme 3dsGamepadConnector \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/3dsGamepadConnector.app Payload/
          zip -r 3dsGamepadConnector.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dsGamepadConnector-unsigned-ipa
          path: 3dsGamepadConnector.ipa
